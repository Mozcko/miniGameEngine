name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (SDL3 is built from source)
        run: scripts/ci-install-deps.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.compiler }}

      - name: Configure (ci preset, warnings as errors)
        run: >
          cmake --preset ci -G Ninja
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ci

      - name: Test (headless)
        # MGE_REQUIRE_GPU / MGE_REQUIRE_VALIDATION: sin GPU (lavapipe) o sin capas de validación los tests de
        # GPU fallan en vez de saltearse. Un "Validation Error" en la salida de un test de GPU lo hace fallar
        # (uso incorrecto de la API o recurso sin liberar): ver tests/gpu/ValidationProbe.cpp
        env:
          MGE_REQUIRE_GPU: "1"
          MGE_REQUIRE_VALIDATION: "1"
        run: ctest --preset ci

      # Las plantillas de scripts/new-game.sh no pueden quedar rotas: generar, compilar y correr
      - name: Template smoke (new-game.sh)
        if: matrix.compiler == 'gcc'
        run: |
          scripts/new-game.sh ci_window --template window
          scripts/new-game.sh ci_headless --headless
          cmake --preset ci -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset ci --target ci_window ci_headless ci_headless_tests
          ctest --preset ci -R "ci_window|ci_headless"

  # AddressSanitizer + UndefinedBehaviorSanitizer: unit tests, headless smoke (1000 frames, sin
  # módulos) y el sandbox real 120 frames offscreen (Mesa llvmpipe). Sin servidor gráfico.
  sanitizers:
    name: sanitizers (ASan + UBSan, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/ci-install-deps.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: asan

      - name: Configure (asan preset)
        run: >
          cmake --preset asan -G Ninja
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset asan

      - name: Test (no display server)
        env:
          MGE_REQUIRE_GPU: "1"
          MGE_REQUIRE_VALIDATION: "1"
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          ctest --preset asan

  # ThreadSanitizer: carreras de datos en el JobSystem y en lo que corre en él (generar/mallar chunks).
  # Solo los módulos headless (core, procgen, voxel): sin SDL ni drivers de GPU bajo TSan.
  tsan:
    name: thread sanitizer (headless)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and GLM only
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build libglm-dev

      - name: Configure (tsan preset)
        run: cmake --preset tsan -G Ninja

      - name: Build
        run: cmake --build --preset tsan

      - name: Test
        run: ctest --preset tsan

  # Proves the headless core builds and runs with NO SDL/GPU installed (ADR 0003)
  core-only:
    name: core-only (no SDL/GPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assert SDL/GL dev packages are absent
        run: |
          for h in /usr/include/SDL2/SDL.h /usr/include/SDL3/SDL.h /usr/include/GL/glew.h /usr/include/GL/gl.h; do
            if [ -e "$h" ]; then echo "::error::$h is installed; this job must run without it"; exit 1; fi
          done

      # Solo herramientas + GLM (matemática header-only, permitida en el core por ADR 0003)
      - name: Install build tools and GLM only
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build libglm-dev

      - name: Configure (core only, warnings as errors)
        run: cmake -S . -B build-core -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMGE_WERROR=ON -DMGE_BUILD_MODULES=OFF

      - name: Build
        run: cmake --build build-core

      - name: Test
        run: ctest --test-dir build-core --output-on-failure

  # Formato (clang-format) y convención de nombres (clang-tidy), mismas versiones que en desarrollo
  lint:
    name: lint (format + naming)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools and dependencies
        run: |
          scripts/ci-install-deps.sh
          pip install --user clang-format==22.1.8 clang-tidy==22.1.8

      - name: Configure (compile_commands.json)
        run: cmake --preset ci -G Ninja

      - name: clang-format + clang-tidy naming
        run: scripts/lint.sh

  # Presupuesto de tamaño de binarios (#60)
  size:
    name: size budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (SDL3 is built from source)
        run: scripts/ci-install-deps.sh

      - name: Check binary size budget
        run: cmake --preset minsize && cmake --build --preset minsize && scripts/check-size.sh build-minsize

  # Verificación de compilación y ejecución sin assets (ADR 0004, #65)
  zero-asset:
    name: zero-asset build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and strace
        run: |
          scripts/ci-install-deps.sh
          sudo apt-get install -y --no-install-recommends strace

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zero-asset-release

      - name: Configure (release preset, no source asset fallback)
        run: >
          cmake --preset release -G Ninja
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DMGE_SOURCE_ASSET_FALLBACK=OFF
          -DMGE_BUILD_TESTS=OFF
          -DMGE_BUILD_BENCHMARKS=OFF

      - name: Build executables
        run: cmake --build --preset release --target headless_smoke sandbox procgen_gallery sdf_glide guide_game c_hello

      - name: Run zero-asset check
        run: scripts/check-zero-asset.sh build-release --require-strace

  # Microbenchmarks de rendimiento (modo Release, headless: core, procgen, voxel, physics).
  # En push a main guarda la línea base (bench-main). En PR compara contra la última línea base.
  bench:
    name: benchmarks (release, headless)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/ci-install-deps.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bench-release

      - name: Configure (release preset)
        run: >
          cmake --preset release -G Ninja
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build mge_bench
        run: cmake --build --preset release --target mge_bench

      - name: Run benchmarks
        run: ./build-release/bench/mge_bench --json bench-results.json

      - name: Upload benchmark baseline artifact (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bench-main
          path: bench-results.json
          retention-days: 90

      - name: Print benchmark summary (main)
        if: github.event_name == 'push'
        run: scripts/bench-compare.sh bench-results.json

      - name: Compare benchmarks against baseline (PR)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use official GitHub CLI (preinstalled on the runner) with GITHUB_TOKEN
          # to download the latest baseline artifact from main without third-party action supply-chain risk.
          mkdir -p baseline
          RUN_ID=$(gh run list --branch main --workflow CI --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name bench-main --dir baseline 2>/dev/null || true
          fi
          if [ ! -f baseline/bench-results.json ] && [ ! -f baseline/bench-main/bench-results.json ]; then
            gh run download --name bench-main --dir baseline 2>/dev/null || true
          fi
          BASELINE="baseline/bench-results.json"
          if [ ! -f "$BASELINE" ] && [ -f "baseline/bench-main/bench-results.json" ]; then
            BASELINE="baseline/bench-main/bench-results.json"
          fi
          scripts/bench-compare.sh bench-results.json "$BASELINE"

  # Paquete reutilizable (Issue #103): install + find_package y FetchContent
  package:
    name: package (install & fetch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/ci-install-deps.sh

      - name: Install system SDL3
        run: scripts/ci-install-sdl3.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: package-release

      - name: Configure and install engine (Release)
        run: |
          cmake -S . -B build-install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/mge-prefix \
            -DMGE_INSTALL=ON \
            -DMGE_SOURCE_ASSET_FALLBACK=OFF \
            -DMGE_BUILD_TESTS=OFF \
            -DMGE_BUILD_BENCHMARKS=OFF \
            -DMGE_BUILD_EXAMPLES=OFF \
            -DMGE_BUILD_SANDBOX=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-install
          cmake --install build-install

      - name: Build consumer with find_package(mge)
        run: |
          cmake -S samples/consumer -B build-consumer-pkg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/mge-prefix \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-consumer-pkg

      - name: Test consumer with find_package (offscreen smoke test)
        run: ctest --test-dir build-consumer-pkg --output-on-failure

      - name: Build C consumer with find_package(mge)
        run: |
          cmake -S samples/c_consumer -B build-c-consumer-pkg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/mge-prefix \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build-c-consumer-pkg

      - name: Test C consumer with find_package (offscreen smoke test)
        run: ctest --test-dir build-c-consumer-pkg --output-on-failure

      - name: Build consumer with FetchContent
        run: |
          cmake -S samples/consumer -B build-consumer-fetch -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMGE_CONSUMER_FETCH=ON \
            -DFETCHCONTENT_SOURCE_DIR_MGE=${{ github.workspace }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-consumer-fetch

      - name: Test consumer with FetchContent (offscreen smoke test)
        run: ctest --test-dir build-consumer-fetch --output-on-failure

  # Plantillas de proyectos independientes (Issue #106)
  templates:
    name: templates (standalone projects)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/ci-install-deps.sh

      - name: Install system SDL3
        run: scripts/ci-install-sdl3.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: templates-release

      - name: Configure and install engine (Release)
        run: |
          cmake -S . -B build-install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/mge-prefix \
            -DMGE_INSTALL=ON \
            -DMGE_SOURCE_ASSET_FALLBACK=OFF \
            -DMGE_BUILD_TESTS=OFF \
            -DMGE_BUILD_BENCHMARKS=OFF \
            -DMGE_BUILD_EXAMPLES=OFF \
            -DMGE_BUILD_SANDBOX=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-install
          cmake --install build-install

      - name: Generate, build and test 3D template
        run: |
          scripts/new-game.sh --template 3d --dir "${RUNNER_TEMP:-/tmp}/game_3d"
          cmake -S "${RUNNER_TEMP:-/tmp}/game_3d" -B "${RUNNER_TEMP:-/tmp}/game_3d/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/mge-prefix \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "${RUNNER_TEMP:-/tmp}/game_3d/build"
          ctest --test-dir "${RUNNER_TEMP:-/tmp}/game_3d/build" --output-on-failure

      - name: Generate, build and test 2D template
        run: |
          scripts/new-game.sh --template 2d --dir "${RUNNER_TEMP:-/tmp}/game_2d"
          cmake -S "${RUNNER_TEMP:-/tmp}/game_2d" -B "${RUNNER_TEMP:-/tmp}/game_2d/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/mge-prefix \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "${RUNNER_TEMP:-/tmp}/game_2d/build"
          ctest --test-dir "${RUNNER_TEMP:-/tmp}/game_2d/build" --output-on-failure

      - name: Generate, build and test headless template
        run: |
          scripts/new-game.sh --template headless --dir "${RUNNER_TEMP:-/tmp}/game_headless"
          cmake -S "${RUNNER_TEMP:-/tmp}/game_headless" -B "${RUNNER_TEMP:-/tmp}/game_headless/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/mge-prefix \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "${RUNNER_TEMP:-/tmp}/game_headless/build"
          ctest --test-dir "${RUNNER_TEMP:-/tmp}/game_headless/build" --output-on-failure

      - name: Generate, build and test C 3D template
        run: |
          scripts/new-game.sh c_game_3d --lang c --template 3d --dir "${RUNNER_TEMP:-/tmp}/c_game_3d"
          cmake -S "${RUNNER_TEMP:-/tmp}/c_game_3d" -B "${RUNNER_TEMP:-/tmp}/c_game_3d/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/mge-prefix \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "${RUNNER_TEMP:-/tmp}/c_game_3d/build"
          ctest --test-dir "${RUNNER_TEMP:-/tmp}/c_game_3d/build" --output-on-failure

      - name: Generate, build and test C Headless template
        run: |
          scripts/new-game.sh c_game_headless --lang c --template headless --dir "${RUNNER_TEMP:-/tmp}/c_game_headless"
          cmake -S "${RUNNER_TEMP:-/tmp}/c_game_headless" -B "${RUNNER_TEMP:-/tmp}/c_game_headless/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/mge-prefix \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "${RUNNER_TEMP:-/tmp}/c_game_headless/build"
          ctest --test-dir "${RUNNER_TEMP:-/tmp}/c_game_headless/build" --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies and engine package
        run: |
          python -m pip install --upgrade pip pytest setuptools wheel
          python -m pip install .

      - name: Generate, test and run Python 3D template
        run: |
          scripts/new-game.sh py_game_3d --lang python --template 3d --dir "${RUNNER_TEMP:-/tmp}/py_game_3d"
          cd "${RUNNER_TEMP:-/tmp}/py_game_3d"
          python -m pip install -e . --no-deps
          python -m pytest
          MGE_MAX_FRAMES=60 python main.py --headless

      - name: Generate, test and run Python 2D template
        run: |
          scripts/new-game.sh py_game_2d --lang python --template 2d --dir "${RUNNER_TEMP:-/tmp}/py_game_2d"
          cd "${RUNNER_TEMP:-/tmp}/py_game_2d"
          python -m pip install -e . --no-deps
          python -m pytest
          MGE_MAX_FRAMES=60 python main.py --headless

  # Herramienta mge CLI (Issue #104)
  cli:
    name: mge cli
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/ci-install-deps.sh

      - name: Install system SDL3
        run: scripts/ci-install-sdl3.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cli-release

      - name: Configure and install engine with CLI (Release)
        run: |
          cmake -S . -B build-install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/mge-prefix \
            -DMGE_INSTALL=ON \
            -DMGE_SOURCE_ASSET_FALLBACK=OFF \
            -DMGE_BUILD_CLI=ON \
            -DMGE_BUILD_TESTS=OFF \
            -DMGE_BUILD_BENCHMARKS=OFF \
            -DMGE_BUILD_EXAMPLES=OFF \
            -DMGE_BUILD_SANDBOX=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-install
          cmake --install build-install

      - name: Verify mge version and doctor
        run: |
          export PATH="/tmp/mge-prefix/bin:$PATH"
          mge --version
          mge doctor

      - name: Test mge new, build, test with 3D template
        run: |
          export PATH="/tmp/mge-prefix/bin:$PATH"
          export CMAKE_PREFIX_PATH=/tmp/mge-prefix
          mge new my_game_3d --template 3d --dir "${RUNNER_TEMP:-/tmp}/my_game_3d"
          cd "${RUNNER_TEMP:-/tmp}/my_game_3d"
          mge build
          mge test

      - name: Test mge new, build, test with headless template
        run: |
          export PATH="/tmp/mge-prefix/bin:$PATH"
          export CMAKE_PREFIX_PATH=/tmp/mge-prefix
          mge new my_game_headless --template headless --dir "${RUNNER_TEMP:-/tmp}/my_game_headless"
          cd "${RUNNER_TEMP:-/tmp}/my_game_headless"
          mge build
          mge test
          mge check
          mge clean

      - name: Test mge new with --yes (scripted wizard defaults)
        run: |
          export PATH="/tmp/mge-prefix/bin:$PATH"
          export CMAKE_PREFIX_PATH=/tmp/mge-prefix
          mge new scripted_game --yes --dir "${RUNNER_TEMP:-/tmp}/scripted_game"
          cd "${RUNNER_TEMP:-/tmp}/scripted_game"
          test -f LICENSE
          test -f .vscode/tasks.json
          grep -q "license=mit" mge.project
          mge build
          mge test

      - name: Test mge new, build, test with C template
        run: |
          export PATH="/tmp/mge-prefix/bin:$PATH"
          export CMAKE_PREFIX_PATH=/tmp/mge-prefix
          mge new my_c_game --lang c --template 3d --dir "${RUNNER_TEMP:-/tmp}/my_c_game"
          cd "${RUNNER_TEMP:-/tmp}/my_c_game"
          mge build
          mge test

      - name: Test mge new, test with Python template
        run: |
          sudo apt-get install -y --no-install-recommends python3-pytest
          export PATH="/tmp/mge-prefix/bin:$PATH"
          mge new my_cli_py_game --lang python --template 2d --dir "${RUNNER_TEMP:-/tmp}/my_cli_py_game"
          cd "${RUNNER_TEMP:-/tmp}/my_cli_py_game"
          mge test

  # Python bindings (Issue #162)
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/ci-install-deps.sh

      - name: Install system SDL3
        run: scripts/ci-install-sdl3.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: python-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[test]" nanobind

      - name: Run pytest test suite
        run: |
          pytest bindings/python/tests -v

      - name: Verify nanobind stub generation
        if: matrix.python-version == '3.12'
        run: |
          python -m nanobind.stubgen -m mge._mge -o bindings/python/mge/_mge.pyi
          git diff --exit-code bindings/python/mge/_mge.pyi

      - name: Run headless simulation example
        run: |
          python examples/python/headless_sim.py

      - name: Run hello example (headless smoke)
        env:
          MGE_MAX_FRAMES: "60"
        run: |
          python examples/python/hello.py --headless



