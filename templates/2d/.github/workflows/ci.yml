name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (ubuntu-24.04)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libglm-dev libstb-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libudev-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers \
            glslang-tools

      - name: Configure (dev preset)
        run: cmake --preset dev -G Ninja

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev
